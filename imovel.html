<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- imovel.html - DETALHE DE UM IMÓVEL (recebe ?id=NÚMERO na URL)
     Página do site público. Topo, menu e rodapé NÃO estão escritos aqui: o js/app.js
     os desenha em <div id="hdr"> e <div id="ftr">. Veja o LEIA-ME.md (seção 3). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imóvel | André Pacheco Negócios Imobiliários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonte Quicksand (Google Fonts). Para trocar: mude este link e o font-family em css/style.css. -->
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Todo o visual do site (cores e instruções no topo do arquivo). -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Topo e menu: preenchido por layout() em js/app.js. -->
<div id="hdr"></div>
<main>
  <!-- DETALHE: todo o conteúdo (galeria, ficha, corretor) é montado por js/imovel.js. -->
<div class="wrap" id="det"><p style="padding:80px 0;text-align:center">Carregando...</p></div>
  <!-- IMÓVEIS SEMELHANTES: começa escondida e só aparece se js/imovel.js achar imóveis parecidos. -->
<section class="rel" id="rel" hidden><div class="wrap"><h2 class="t">Imóveis semelhantes</h2><div class="grid" id="relg"></div></div></section>
</main>
<!-- GALERIA EM TELA CHEIA (lightbox): botões fechar, anterior e próxima; controlada por js/imovel.js. -->
<div class="lb" id="lb" hidden><button class="x" aria-label="Fechar">×</button><button class="pv" aria-label="Anterior">‹</button><img alt=""><button class="nx" aria-label="Próxima">›</button></div>
<!-- Rodapé, botão do WhatsApp e balão: preenchidos por layout() em js/app.js. O chatbot (js/chat.js) é carregado depois, pelo app.js. -->
<div id="ftr"></div>

<!-- SCRIPTS: a ORDEM IMPORTA. config.js (endereço da API) -> mock.js (dados de exemplo)
     -> [script desta página, se houver] -> app.js (núcleo; roda por último e chama a lógica da página). -->
<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<!-- Tradução da interface (PT/EN/ES): js/i18n.js. Deve vir antes do app.js. -->
<script src="js/i18n.js"></script>
<!-- Lógica desta página (define window.onAP, chamada pelo app.js). -->
<script src="js/imovel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
