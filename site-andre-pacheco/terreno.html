<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- terreno.html - TERRENO + CONSTRUÇÃO (texto e formulário)
     Página do site público. Topo, menu e rodapé NÃO estão escritos aqui: o js/app.js
     os desenha em <div id="hdr"> e <div id="ftr">. Veja o LEIA-ME.md (seção 3). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terreno + construção | André Pacheco Negócios Imobiliários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonte Quicksand (Google Fonts). Para trocar: mude este link e o font-family em css/style.css. -->
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<!-- Todo o visual do site (cores e instruções no topo do arquivo). -->
<link rel="stylesheet" href="css/style.css">
</head>
<!-- data-p="terreno": js/paginas.js usa este valor para escolher o conteúdo desta página. Para criar outra página, copie este arquivo e mude data-p e o título. -->
<body data-p="terreno">
<!-- Topo e menu: preenchido por layout() em js/app.js. -->
<div id="hdr"></div>
<main>
  <div class="pghead"><div class="wrap"><h1>Terreno + construção</h1><p id="sub"></p></div></div>
  <!-- Conteúdo da página: montado por js/paginas.js dentro deste bloco (id pg). O subtítulo (id sub) também. -->
<div class="wrap pg" id="pg"></div>
</main>
<!-- Rodapé, botão do WhatsApp e balão: preenchidos por layout() em js/app.js. O chatbot (js/chat.js) é carregado depois, pelo app.js. -->
<div id="ftr"></div>

<!-- SCRIPTS: a ORDEM IMPORTA. config.js (endereço da API) -> mock.js (dados de exemplo)
     -> [script desta página, se houver] -> app.js (núcleo; roda por último e chama a lógica da página). -->
<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<!-- Tradução da interface (PT/EN/ES): js/i18n.js. Deve vir antes do app.js. -->
<script src="js/i18n.js"></script>
<!-- Lógica das páginas institucionais (define window.onAP, chamada pelo app.js). -->
<script src="js/paginas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
